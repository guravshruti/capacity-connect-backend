<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capacity Connect - Materials</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <h2>Capacity Connect</h2>
        <div>
            <a href="courses.html">Courses</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html">Profile</a>
            <a href="materials.html">Materials</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div class="page-hero">
        <div class="page-hero-inner">
            <h1>Study Materials</h1>
            <p>Upload resources for a course, or browse what's already shared.</p>
        </div>
    </div>

    <div class="page">

        <div class="course-card">
            <span class="field-label">Select a course</span>
            <select id="course-select" onchange="loadMaterials()"></select>

            <span class="field-label">Material title</span>
            <input type="text" id="material-title" placeholder="e.g. Week 1 Reading Notes">

            <span class="field-label">Link (URL)</span>
            <input type="text" id="material-url" placeholder="https://...">

            <br><br>
            <button onclick="uploadMaterial()">Upload Material</button>
            <p id="upload-message"></p>
        </div>

        <h2 style="margin-top:32px;">Materials for this course</h2>
        <div id="materials-list">
            <p>Select a course above to see its materials.</p>
        </div>

    </div>

    <script src="materials.js"></script>
</body>
</html>
